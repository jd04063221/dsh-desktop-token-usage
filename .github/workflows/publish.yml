# Publish @jd04063221/dsh-desktop-token-usage to npm.
#
# Trigger: pushing a version tag (v*), or a manual run from the Actions tab.
# A manual run defaults to the dry run, so it is safe to click.
#
# Authentication: the NPM_TOKEN repository secret. It must be a granular access
# token with "Read and write" on this package (or all packages) **and "Bypass
# 2FA" enabled** — without bypass 2FA the registry rejects the publish with
# "Two-factor authentication is required to publish this package but an
# automation token was specified" (403).
#
# To switch to Trusted Publishing later (no long-lived token at all): set the
# publisher on npm for this repository + workflow, then add `id-token: write`
# under permissions and replace the `NODE_AUTH_TOKEN` env with
# `--provenance` on the publish step. The rest of this file stays as is.
#
# There is no separate "run the tests" step on purpose: package.json binds
# `prepublishOnly` to `npm test`, so every publish below runs the suite first.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish uploads to npm; dry-run only packs'
        type: choice
        options: [dry-run, publish]
        default: dry-run

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # No lockfile is committed, so this cannot be `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package version $version"

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dry run
        if: github.event_name != 'push' && inputs.mode != 'publish'
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
