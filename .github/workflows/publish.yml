# Publish dsh-desktop-token-usage to npm via Trusted Publishing (OIDC), then create
# the matching GitHub Release from this version's changelog section.
#
# Trigger: pushing a version tag (v*), or a manual run from the Actions tab.
# A manual run defaults to the dry run, so it is safe to click.
#
# Authentication: OpenID Connect — there is no long-lived token anywhere.
# The exchange needs three things:
#   1. `id-token: write` in this file (below);
#   2. a trusted publisher registered on npm for this package:
#        provider    GitHub Actions
#        repository  jd04063221/dsh-desktop-token-usage
#        workflow    publish.yml
#        permission  publish
#      registered with:
#        npx npm@11.20.0 trust github dsh-desktop-token-usage --file publish.yml \
#          --repo jd04063221/dsh-desktop-token-usage --allow-publish
#      (that command itself needs 2FA and cannot use a bypass-2FA token);
#   3. npm >= 11.5.1 on the runner, so the CLI is upgraded below — the npm
#      bundled with Node 22 is older and cannot complete the OIDC exchange.
# Provenance attestations are generated automatically by trusted publishing.
#
# The GitHub Release is a second job on purpose: it needs `contents: write`, which the
# job that performs the OIDC exchange must not have. It runs for a tag ref only and
# only after the upload succeeded, so a failed publish leaves no release behind. `gh`
# is preinstalled on the runner and authenticates with `$GITHUB_TOKEN`; the notes come
# from scripts/release-notes.mjs, so the same body can be regenerated by hand
# (see docs/publishing.local.md).
#
# There is no separate "run the tests" step on purpose: package.json binds
# `prepublishOnly` to `npm test`, so every publish below runs the suite first.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish uploads to npm; dry-run only packs'
        type: choice
        options: [dry-run, publish]
        default: dry-run

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # the OIDC exchange with the npm registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older one.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.15.0

      # No lockfile is committed, so this cannot be `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package version $version"

      # No NODE_AUTH_TOKEN on purpose: the CLI authenticates through OIDC.
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: npm publish

      - name: Publish dry run
        if: github.event_name != 'push' && inputs.mode != 'publish'
        run: npm publish --dry-run

  # Separate job, so the publishing job keeps its least-privilege permissions: only
  # this one gets `contents: write`. `needs: publish` means nothing is released unless
  # the npm upload succeeded, and the tag guard keeps a manual run from a branch from
  # releasing anything.
  #
  # Dispatching this workflow from a tag ref is the repair path for a tag whose release
  # is missing: an existing release is left untouched, a missing one is created from
  # that version's changelog section.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that writes to the repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the GitHub Release from this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to do"
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
