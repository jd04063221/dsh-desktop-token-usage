# Publish dsh-desktop-token-usage to npm via Trusted Publishing (OIDC).
#
# Trigger: pushing a version tag (v*), or a manual run from the Actions tab.
# A manual run defaults to the dry run, so it is safe to click.
#
# Authentication: OpenID Connect — there is no long-lived token anywhere.
# The exchange needs three things:
#   1. `id-token: write` in this file (below);
#   2. a trusted publisher registered on npm for this package:
#        provider    GitHub Actions
#        repository  jd04063221/dsh-desktop-token-usage
#        workflow    publish.yml
#        permission  publish
#      registered with:
#        npx npm@11.20.0 trust github dsh-desktop-token-usage --file publish.yml \
#          --repo jd04063221/dsh-desktop-token-usage --allow-publish
#      (that command itself needs 2FA and cannot use a bypass-2FA token);
#   3. npm >= 11.5.1 on the runner, so the CLI is upgraded below — the npm
#      bundled with Node 22 is older and cannot complete the OIDC exchange.
# Provenance attestations are generated automatically by trusted publishing.
#
# There is no separate "run the tests" step on purpose: package.json binds
# `prepublishOnly` to `npm test`, so every publish below runs the suite first.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish uploads to npm; dry-run only packs'
        type: choice
        options: [dry-run, publish]
        default: dry-run

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # the OIDC exchange with the npm registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older one.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.15.0

      # No lockfile is committed, so this cannot be `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package version $version"

      # No NODE_AUTH_TOKEN on purpose: the CLI authenticates through OIDC.
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: npm publish

      - name: Publish dry run
        if: github.event_name != 'push' && inputs.mode != 'publish'
        run: npm publish --dry-run
