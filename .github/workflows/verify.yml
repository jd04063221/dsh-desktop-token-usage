# Continuous verification for pushes to main and pull requests, plus a weekly
# scheduled run so an upstream DSH release that silently breaks this plugin is
# caught without anyone pushing.
#
# Modelled on Duskriver/dsh-opencode-go verify.yml. Two differences are
# deliberate:
#
#   * Two jobs rather than three. The reference package-manager install matrix
#     and host-compatibility job have no counterpart here; this plugin published
#     artifact is checked by the tarball verifier instead, and DSH-version
#     compatibility has its own manual workflow (compat.yml).
#   * The lockfile IS committed: installs run npm ci with cache npm,
#     so CI is reproducible and npm audit has a locked tree to check.
#
# The tests that need real session logs skip themselves when DSH_HOME has none,
# so the suite still asserts the plugin offline on a clean runner.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 03:17 UTC: catch upstream rot (DSH, schemastery, Node) weekly.
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # npm test covers this indirectly through test/i18n.test.mjs, but a
      # direct call fails with the fix command instead of an assertion diff,
      # which is what a translation contributor needs to see.
      - name: The dictionary block is fresh
        run: node scripts/build-dicts.mjs --check
      - name: Run the test suite
        run: npm test

  package:
    name: package (tarball contents and install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: The dictionary block is fresh
        run: node scripts/build-dicts.mjs --check
      - name: Verify the published tarball
        run: npm run test:package
      - name: Audit production dependencies
        run: npm run audit
