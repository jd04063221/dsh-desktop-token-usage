# CodeQL: default setup is preferred (no config needed), but this repo keeps
# an explicit workflow so the scan runs on the same schedule as Verify and
# its result is visible next to the test matrix. JS-only, no build step.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Same Monday as Verify, one hour later so the two do not queue together.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript)
    # Dependabot-triggered runs never receive `security-events: write` (GitHub
    # downgrades their GITHUB_TOKEN), so the job dies in "Set up job" three
    # seconds in. Dependency PRs are covered by Verify plus the next push to
    # main; skip them here instead of leaving a permanently red check.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
